# deploygo 官网 Nginx 配置
# 结构：dist/<route>/index.html 的静态预渲染站点 + 同源反向代理 /api/

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    charset utf-8;
    server_tokens off;

    # —— 压缩 ——
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_comp_level   6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        application/manifest+json
        image/svg+xml
        font/woff2;

    # —— 安全响应头 ——
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;

    # —— 公开 API 同源代理到后端服务（compose 服务名 api） ——
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # —— 入口文件与版本文件不缓存 ——
    location ~* ^/(index\.html|version\.json)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        try_files $uri =404;
    }

    # —— 带 hash 的静态资源长缓存 ——
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|webp|avif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    # —— sitemap / robots 短缓存 ——
    location ~* ^/(sitemap\.xml|robots\.txt)$ {
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # —— 预渲染页面：直接按目录/文件命中，未命中时返回 404 页面 ——
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    error_page 404 /404.html;
}

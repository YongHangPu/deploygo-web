<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#0d1117" />
    <meta name="color-scheme" content="dark light" />
    <script>
      // 在首屏渲染前应用主题，避免深色/浅色闪烁；默认深色。
      ;(function () {
        try {
          var stored = localStorage.getItem('deploygo-theme')
          var theme = stored === 'light' || stored === 'dark' ? stored : 'dark'
          var root = document.documentElement
          root.dataset.theme = theme
          root.style.colorScheme = theme
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'light' ? '#f6f7f9' : '#0d1117')
        } catch (error) {
          /* localStorage 不可用时保持默认深色 */
        }
      })()
    </script>
    <meta
      name="description"
      content="deploygo 是一款面向前端静态项目的桌面端部署工具，提供一键部署、版本管理、重复发布拦截与快速回滚能力。"
    />
    <title>deploygo · 让前端发布更稳、更简单</title>
  </head>
  <body>
    <div id="app"></div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif; color: #e6edf3; background: #0d1117">
        deploygo 官网需要 JavaScript 才能展示完整体验。你也可以直接访问
        <a href="https://github.com/YongHangPu/deploygo" style="color: #58a6ff">GitHub 仓库</a>
        了解项目。
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
